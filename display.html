<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match Scoreboard Display</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: transparent; /* Transparent for OBS overlay */
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .scoreboard {
            display: flex;
            align-items: center;
            background: linear-gradient(135deg, rgba(10, 25, 47, 0.95), rgba(30, 41, 59, 0.95));
            border: 3px solid #FFD700;
            border-radius: 16px;
            padding: 15px 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            color: #ffffff;
            gap: 25px;
        }
        .team {
            font-size: 28px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 200px;
            text-align: center;
        }
        .team-1 { color: #60a5fa; }
        .team-2 { color: #f87171; }
        
        .score-box {
            background: #0f172a;
            border: 2px solid #FFD700;
            border-radius: 10px;
            font-size: 48px;
            font-weight: 900;
            padding: 5px 25px;
            letter-spacing: 2px;
        }
        .center-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 15px;
            border-left: 2px solid rgba(255,215,0,0.3);
            border-right: 2px solid rgba(255,215,0,0.3);
        }
        .timer {
            font-size: 32px;
            font-weight: 800;
            color: #FFD700;
            background: rgba(0,0,0,0.4);
            padding: 4px 15px;
            border-radius: 6px;
            margin-bottom: 5px;
        }
        .period {
            font-size: 14px;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="scoreboard">
        <div class="team team-1" id="displayTeam1">Home Team</div>
        <div class="score-box" id="displayScore1">0</div>
        
        <div class="center-info">
            <div class="timer" id="displayTimer">00:00</div>
            <div class="period" id="displayPeriod">1st Half</div>
        </div>

        <div class="score-box" id="displayScore2">0</div>
        <div class="team team-2" id="displayTeam2">Away Team</div>
    </div>

    <script>
        // Sync data from localStorage automatically
        function updateDisplay() {
            const data = JSON.parse(localStorage.getItem('matchData')) || {
                team1: "Home Team",
                team2: "Away Team",
                score1: 0,
                score2: 0,
                timer: "00:00",
                period: "1st Half"
            };

            document.getElementById('displayTeam1').innerText = data.team1;
            document.getElementById('displayTeam2').innerText = data.team2;
            document.getElementById('displayScore1').innerText = data.score1;
            document.getElementById('displayScore2').innerText = data.score2;
            document.getElementById('displayTimer').innerText = data.timer;
            document.getElementById('displayPeriod').innerText = data.period;
        }

        // Check for updates every 100 milliseconds
        setInterval(updateDisplay, 100);
        updateDisplay();
    </script>
</body>
</html>
